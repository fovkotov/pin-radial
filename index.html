<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PIN — радиальный конструктор</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./scrubbers.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "fflate": "./vendor/fflate/browser.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="gate" class="gate">
      <form id="gate-form" class="gate__card" autocomplete="off">
        <div class="gate__brand">PIN <span>radial</span></div>
        <p class="gate__hint">Введите пароль, чтобы открыть конструктор</p>
        <div id="fluid-host-gate" class="fluid-host fluid-host--block fluid-host--gate"></div>
      </form>
    </div>

    <div id="app" class="app" hidden>
      <!-- LEFT: global generation / composition only -->
      <aside class="sidebar sidebar--left" aria-label="глобальные настройки">
        <div class="sidebar__scroll">
          <div class="brand">PIN <span>radial</span></div>

          <section class="side-section">
            <h2 class="side-section__title">режим</h2>
            <div id="fluid-host-mode" class="fluid-host"></div>
          </section>

          <section id="composition-section" class="side-section">
            <h2 class="side-section__title">композиция</h2>
            <div id="fluid-host-random" class="fluid-host fluid-host--block"></div>
            <div
              id="composition-scrubbers"
              class="composition-scrubbers-host"
            ></div>
          </section>

          <section id="strips-section" class="side-section" hidden>
            <h2 class="side-section__title">лента</h2>
            <div id="fluid-host-strips-count" class="fluid-host fluid-host--block"></div>
            <div id="fluid-host-strips-width" class="fluid-host fluid-host--block"></div>
          </section>

          <section id="anim-section" class="side-section" hidden>
            <h2 class="side-section__title side-section__title--toggle">
              <button
                id="anim-accordion-toggle"
                type="button"
                class="accordion-toggle"
                aria-expanded="false"
                aria-controls="anim-accordion-body"
              >
                <span>моушн</span>
                <svg class="accordion-toggle__chevron" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
                  <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </h2>
            <div id="anim-accordion-body" class="accordion-body" role="region" aria-labelledby="anim-accordion-toggle" inert>
              <div class="accordion-body__inner">
                <div id="fluid-host-anim-stepped" class="fluid-host"></div>
                <div id="fluid-host-anim-spin" class="fluid-host"></div>
                <div id="fluid-host-anim-size" class="fluid-host"></div>
                <div id="fluid-host-anim-particles" class="fluid-host"></div>
                <div id="fluid-host-anim-sound" class="fluid-host"></div>
                <div id="fluid-host-anim-waves" class="fluid-host"></div>
                <div id="fluid-host-anim-speed" class="fluid-host"></div>
              </div>
            </div>
          </section>
        </div>

        <div class="sidebar__footer">
          <div id="fluid-host-export-video" class="fluid-host fluid-host--block"></div>
          <p id="export-video-error" class="export-error" hidden role="alert"></p>
          <div id="fluid-host-export-fbx" class="fluid-host fluid-host--block"></div>
          <div id="fluid-host-export-svg" class="fluid-host fluid-host--block"></div>
        </div>
      </aside>

      <div class="workspace">
        <main class="stage">
          <svg
            id="canvas"
            viewBox="0 0 800 800"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Холст радиальной графики"
          >
            <rect id="bg" width="800" height="800" fill="#dbdfe7" />
            <g id="anim-root">
              <g id="layer-grid"></g>
              <g id="layer-segments"></g>
              <g id="layer-texts"></g>
              <defs id="text-defs"></defs>
              <g id="layer-ui" class="ui-only"></g>
            </g>
          </svg>
          <svg
            id="strips-canvas"
            class="strips-canvas"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Ленты с иконками"
            hidden
          ></svg>
          <div id="view3d" class="view3d" hidden></div>

          <div
            id="fluid-host-fabs"
            class="stage-fab"
            role="toolbar"
            aria-label="добавить"
          ></div>
        </main>

        <!-- RIGHT: selected item only -->
        <aside class="sidebar sidebar--right" aria-label="Свойства объекта">
          <div class="sidebar__scroll">
            <section id="props-segment" class="side-section" hidden>
              <h2 class="side-section__title">сегмент</h2>
              <div class="field">
                <label>заливка</label>
                <div class="palette" id="fill-palette"></div>
              </div>
              <div id="fluid-host-seg-fields" class="fluid-host fluid-host--block"></div>
              <div id="fluid-host-delete-seg" class="fluid-host fluid-host--block"></div>
            </section>
          </div>
        </aside>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
    <script type="module" src="./scrubbers.js"></script>
  </body>
</html>
